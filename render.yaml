# One-click Render blueprint.
#   1. Push this repo to GitHub
#   2. Render Dashboard -> New -> Blueprint -> pick the repo
#   3. Fill in the `sync: false` values when prompted
#
# The free Postgres instance and the web service are created together, and
# DATABASE_URL is wired automatically.
services:
  - type: web
    name: clinix
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: clinix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret for you
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      # --- set these in the dashboard (marked sync:false so they are prompted) ---
      - key: PUBLIC_BASE_URL          # e.g. https://clinix.onrender.com
        sync: false
      - key: GOOGLE_REDIRECT_URI      # $PUBLIC_BASE_URL/api/calendar/callback
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY           # optional — omit to run on the fallback
        sync: false
      - key: SENDGRID_API_KEY         # optional — omit to use the on-disk outbox
        sync: false
      - key: GOOGLE_CLIENT_ID         # optional
        sync: false
      - key: GOOGLE_CLIENT_SECRET     # optional
        sync: false

databases:
  - name: clinix-db
    plan: free
    region: singapore
