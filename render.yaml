# One-click Render blueprint.
#   1. Push this repo to GitHub
#   2. Render Dashboard -> New -> Blueprint -> pick the repo
#   3. Fill in the `sync: false` values when prompted
#
# The free Postgres instance and the web service are created together, and
# DATABASE_URL is wired automatically.
services:
  - type: web
    name: clinix
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: clinix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret for you
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      # --- set these in the dashboard (marked sync:false so they are prompted) ---
      - key: PUBLIC_BASE_URL          # e.g. https://clinix.onrender.com
        sync: false
      - key: GOOGLE_REDIRECT_URI      # $PUBLIC_BASE_URL/api/calendar/callback
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY           # optional — omit to run on the fallback
        sync: false
      # --- email: SMTP (Gmail/Mailgun/Postmark). Omit all of these to fall
      #     back to the on-disk outbox, which still exercises the full
      #     notification lifecycle and is visible in the admin portal.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: EMAIL_FROM_NAME
        value: Clinix Care Clinic
      - key: SMTP_USER               # your Gmail address
        sync: false
      - key: SMTP_PASSWORD           # 16-character Gmail app password
        sync: false
      - key: EMAIL_FROM              # must equal SMTP_USER for Gmail
        sync: false
      - key: SENDGRID_API_KEY        # alternative to SMTP; leave blank if using Gmail
        sync: false
      - key: GOOGLE_CLIENT_ID         # optional
        sync: false
      - key: GOOGLE_CLIENT_SECRET     # optional
        sync: false

databases:
  - name: clinix-db
    plan: free
    region: singapore
